<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img class="brand-icon" src="icons/icon-32.png" alt="" width="18" height="18" />
        <span class="brand-name">Slop Blocker</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="master" />
        <span class="switch-track"><span class="switch-knob"></span></span>
      </label>
    </header>

    <p class="banner" id="localeWarning" data-i18n="popupLocaleWarning" hidden></p>
    <p class="banner banner--off" id="offBanner" data-i18n="popupDisabled" hidden></p>

    <section class="section section--quick" id="quickActions" hidden>
      <h2 class="section-title" data-i18n="popupQuickActions"></h2>
      <div class="subject">
        <span class="subject-platform" id="subjectPlatform"></span>
        <span class="subject-name" id="subjectName"></span>
      </div>
      <p class="subject-item" id="subjectItem" hidden></p>
      <div class="quick-buttons" id="quickButtons"></div>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="popupCurrentPage"></h2>
      <ul class="list" id="detections"></ul>
      <div class="empty" id="empty">
        <span class="empty-title" data-i18n="popupEmpty"></span>
        <span class="empty-hint" data-i18n="popupEmptyHint"></span>
      </div>
    </section>

    <section class="section section--trackers">
      <button class="disclosure" id="trackerToggle" type="button">
        <span id="trackerLabel"></span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>
      <ul class="list list--compact" id="trackers" hidden></ul>
      <p class="note" id="trackerNote" data-i18n="popupTrackersBlockNote" hidden></p>
    </section>

    <footer class="foot">
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="lifetime">0</span>
          <span class="stat-label" data-i18n="popupLifetime"></span>
        </div>
        <div class="stat">
          <span class="stat-value" id="session">0</span>
          <span class="stat-label" data-i18n="popupSession"></span>
        </div>
      </div>
      <div class="foot-actions">
        <button class="link" id="disableSite" type="button" data-i18n="popupDisableSite"></button>
        <button class="link" id="openOptions" type="button" data-i18n="popupOptions"></button>
      </div>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
