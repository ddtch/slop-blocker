name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck (both tsconfigs), unit + integration tests, then the build.
      - run: npm run check
      # The icons are committed; this fails if they drift from the generator.
      # Scoped to exactly the files it writes, so an unrelated change under
      # docs/ is not reported as icon drift.
      - run: npm run icons
      - run: >
          git diff --exit-code --
          icons/
          docs/favicon.ico docs/favicon-16.png docs/favicon-32.png docs/apple-touch-icon.png
      # The published privacy policy is generated from PRIVACY.md. If the two
      # disagree, the one people actually read is the wrong one.
      - run: npm run privacy && git diff --exit-code -- docs/privacy/
      # Packages dist/ deterministically and prints the hash the release should carry.
      - run: npm run pack
